name: Deploy WordPress Theme (manual)

# MANUAL-ONLY fallback deployer. The primary deploy path is hPanel Git
# following the deploy/theme branch (see build-theme-branch.yml).
# Run this manually only if you need to bypass hPanel Git.

on:
  workflow_dispatch:

concurrency:
  group: theme-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Establish known host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p 65002 -T 10 157.173.209.5 >> ~/.ssh/known_hosts 2>/dev/null
          fi

      # Only theme files ever leave the repo. Never public_html, never wp-config.
      - name: Sync theme files to aesoftwares-theme
        run: |
          rsync -avzi --delete \
            --exclude '.git/' --exclude '.github/' \
            --exclude 'crm/' --exclude 'scripts/' --exclude 'src/' \
            --exclude '*.md' --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude '.gitignore' --exclude '.gitattributes' \
            -e "ssh -p 65002" \
            ./ u257353593@157.173.209.5:domains/aesoftwaresolutions.com/public_html/wp-content/themes/aesoftwares-theme/

      - name: Soft-verify site after deploy
        run: |
          curl -fsSI --max-time 20 https://aesoftwaresolutions.com/ || echo "::warning::Post-deploy check could not reach the site (bot protection may block automated requests)"
          curl -fsSI --max-time 20 https://aesoftwaresolutions.com/wp-json/aesoftwares/v1/ || echo "::warning::REST namespace check unreachable (may be blocked for bots)"
