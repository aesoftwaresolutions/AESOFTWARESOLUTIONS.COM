name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 65002 -T 10 157.173.209.5 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy — git pull on server
        run: |
          ssh -p 65002 -o StrictHostKeyChecking=no u257353593@157.173.209.5 "
            set -e
            cd /home/u257353593/domains/aesoftwaresolutions.com/public_html/wp-content/themes/aesoftwares-theme
            git stash
            git pull origin master
            echo 'Deployed:' \$(git log --oneline -1)
          "

      - name: Ensure WordPress pages exist
        run: |
          ssh -p 65002 -o StrictHostKeyChecking=no u257353593@157.173.209.5 "
            WP='wp --allow-root --path=/home/u257353593/domains/aesoftwaresolutions.com/public_html'
            declare -A titles=(
              [services]='Services'
              [process]='Process'
              [about]='About'
              [contact]='Contact'
              [work]='Work'
              [free-tools]='Free Tools'
              [rewriter]='AI Content Rewriter'
              [email-drafter]='AI Email Drafter'
              [summarizer]='AI Text Summarizer'
              [transcriber]='AI Audio Transcriber'
              [marketplace]='Marketplace'
              [console]='Admin Console'
              [aria-store]='Aria Store'
              [aria-console]='Aria Console'
              [aria-marketplace]='Aria Marketplace'
            )
            for slug in \"\${!titles[@]}\"; do
              title=\"\${titles[\$slug]}\"
              if ! \$WP post list --post_type=page --post_status=publish --name=\"\$slug\" --field=ID | grep -q '[0-9]'; then
                \$WP post create --post_type=page --post_title=\"\$title\" --post_status=publish --post_name=\"\$slug\" --page_template=\"page-\${slug}.php\"
                echo \"Created page: \$slug (\$title)\"
              else
                echo \"Page exists: \$slug\"
              fi
            done
          "

      - name: Purge LiteSpeed cache
        run: |
          ssh -p 65002 -o StrictHostKeyChecking=no u257353593@157.173.209.5 \
            "wp litespeed-purge all --allow-root --path=/home/u257353593/domains/aesoftwaresolutions.com/public_html" || true
