name: Setup Marketplace Scraper on VPS

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 65002 -T 10 157.173.209.5 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run deploy script on VPS
        run: |
          ssh -p 65002 -o StrictHostKeyChecking=no \
               -o ConnectTimeout=30 \
               u257353593@157.173.209.5 'bash -s' \
               < scripts/deploy-marketplace.sh

      - name: Save generated token as output
        run: |
          echo "Check the step above for the SERVICE_TOKEN line."
          echo "Copy it into WP Admin → AE Settings → Marketplace Service Token."
