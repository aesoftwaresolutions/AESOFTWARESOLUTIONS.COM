services:
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      WHISPER__MODEL: "Systran/faster-whisper-small"
      TTS__MODEL: "hexgrad/Kokoro-82M"
      API_KEY: "${SPEACHES_API_KEY:-changeme}"
    volumes:
      - speaches-cache:/home/user/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  speaches-cache:
